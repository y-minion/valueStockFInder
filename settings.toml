# 주간 배당주 스크리너 설정. 기준값은 엑셀 '기준값' 시트와 같은 기본값이에요.

[criteria]
required_return = 0.10        # 요구수익률: 이 주식에서 1년에 벌고 싶은 수익률 (방법 A와 시장 예상 EPS·ROE에 써요)
safety_margin = 0.25          # 안전마진: 계산이 틀릴 때를 대비한 여유분. 매수선 = 보수적 적정가 × (1 − 안전마진)
roe_min = 8.0                 # ROE 최소(%): 5년 평균 ROE가 이 값 이상이어야 해요 (관문 ①)
debt_ratio_max = 200.0        # 부채비율 최대(%): 최근 부채비율이 이 값 미만이어야 해요 (관문 ①)
interest_coverage_min = 3.0   # 이자보상배율 최소: 영업이익이 이자의 이 배수 이상이어야 해요 (관문 ①)
ocf_to_ni_min = 1.0           # 영업현금흐름÷순이익 최소: 5년 합계 기준 (관문 ①)
payout_min = 0.20             # 배당성향 하한: 평균 배당성향 범위의 아래쪽 (관문 ②)
payout_max = 0.60             # 배당성향 상한: 평균 배당성향 범위의 위쪽 (관문 ②)
fcf_to_div_min = 1.0          # 잉여현금흐름÷배당 최소: 5년 합계 기준 (관문 ②)
abnormal_ratio = 0.5          # 비정상인 해 기준: EPS가 정상 EPS의 이 비율보다 작거나 적자인 해는 평균 PER·배당수익률·배당성향에서 빼요
isa_weight_max = 0.10         # 개별 종목 비중 상한: 판정에는 안 쓰고 '다음에 할 일' 문장에만 나와요

[report]
watch_range = 0.20            # 관심 목록 범위: 매수선보다 이 비율 안쪽으로 가까워지면 관심 목록에 올려요
near_range = 0.10             # 근접 범위: 매수선에 이 비율 안쪽으로 다가오면 '근접'으로 표시해요

[industry]
use_in_verdict = false        # 업종 비교를 판정에 넣을지 여부
roe_top_percent = 50.0        # 업종 안에서 ROE가 상위 몇 % 안이어야 하는지
min_group_size = 5            # 업종 묶음에 종목이 이 개수 이상일 때만 비교해요

[industry.overrides]
# 업종 코드별로 기준값을 덮어써요. 예시:
# "35" = { roe_min = 6 }

[paths]
calculator = "/Users/youngmin/가치투자/배당주_분석_계산기.xlsx"   # 원본 계산기 (읽기만 해요)
data_dir = "data"
reports_dir = "reports"
exports_dir = "exports"

[dart]
daily_budget = 19000          # OpenDART 하루 호출 한도 안쪽의 사용 예산

[financial]
include = true              # 금융회사를 금융업 기준으로 분석해요. false면 지금처럼 빼요.
bank_cet1_min = 9.0         # 은행·금융지주 보통주자본비율 최소(%): 2026년 대형 은행지주(D-SIB) 최저 적립 필요 수준
insurer_kics_min = 130.0    # 보험 지급여력비율(K-ICS) 최소(%): 금융위원회 권고 기준 (2025-06-11 150%→130%)
securities_ncr_min = 100.0  # 증권 순자본비율 최소(%): 감독 최소 기준
