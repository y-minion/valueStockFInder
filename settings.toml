# 주간 배당주 스크리너 설정. 기준값은 엑셀 '기준값' 시트와 같은 기본값이에요.

[criteria]
required_return = 0.10        # 요구수익률: 이 주식에서 1년에 벌고 싶은 수익률 (방법 A와 시장 예상 EPS·ROE에 써요)
safety_margin = 0.25          # 안전마진: 계산이 틀릴 때를 대비한 여유분. 매수선 = 보수적 적정가 × (1 − 안전마진)
roe_min = 8.0                 # ROE 최소(%): 5년 평균 ROE가 이 값 이상이어야 해요 (관문 ①)
debt_ratio_max = 200.0        # 부채비율 최대(%): 최근 부채비율이 이 값 미만이어야 해요 (관문 ①)
interest_coverage_min = 3.0   # 이자보상배율 최소: 영업이익이 이자의 이 배수 이상이어야 해요 (관문 ①)
ocf_to_ni_min = 1.0           # 영업현금흐름÷순이익 최소: 5년 합계 기준 (관문 ①)
payout_min = 0.20             # 배당성향 하한: 평균 배당성향 범위의 아래쪽 (관문 ②)
payout_max = 0.60             # 배당성향 상한: 평균 배당성향 범위의 위쪽 (관문 ②)
fcf_to_div_min = 1.0          # 잉여현금흐름÷배당 최소: 5년 합계 기준 (관문 ②)
abnormal_ratio = 0.5          # 비정상인 해 기준: EPS가 정상 EPS의 이 비율보다 작거나 적자인 해는 평균 PER·배당수익률·배당성향에서 빼요
isa_weight_max = 0.10         # 개별 종목 비중 상한: 판정에는 안 쓰고 '다음에 할 일' 문장에만 나와요

[report]
watch_range = 0.20            # 관심 목록 범위: 매수선보다 이 비율 안쪽으로 가까워지면 관심 목록에 올려요
near_range = 0.10             # 근접 범위: 매수선에 이 비율 안쪽으로 다가오면 '근접'으로 표시해요

[industry]
use_in_verdict = false        # 업종 비교를 판정에 넣을지 여부
roe_top_percent = 50.0        # 업종 안에서 ROE가 상위 몇 % 안이어야 하는지
min_group_size = 5            # 업종 묶음에 종목이 이 개수 이상일 때만 비교해요

[industry.overrides]
# 업종 코드별로 기준값을 덮어써요. 예시:
# "35" = { roe_min = 6 }

[paths]
calculator = "/Users/youngmin/가치투자/배당주_분석_계산기.xlsx"   # 원본 계산기 (읽기만 해요)
data_dir = "data"
reports_dir = "reports"
exports_dir = "exports"

[dart]
daily_budget = 19000          # OpenDART 하루 호출 한도 안쪽의 사용 예산

[financial]
include = true              # 금융회사를 금융업 기준으로 분석해요. false면 지금처럼 빼요.
bank_cet1_min = 9.0         # 은행·금융지주 보통주자본비율 최소(%): 2026년 대형 은행지주(D-SIB) 최저 적립 필요 수준
insurer_kics_min = 130.0    # 보험 지급여력비율(K-ICS) 최소(%): 금융위원회 권고 기준 (2025-06-11 150%→130%)
securities_ncr_min = 100.0  # 증권 순자본비율 최소(%): 감독 최소 기준

# ---- 점수 순위 ----
# 최근 해에 배당을 준 종목마다 100점 만점 점수를 매겨요. 숫자만 바꿔서 배점과 구간을 고칠 수 있어요.
# steps = [[경계, 점수], …]는 위에서부터 보고 처음 맞는 줄의 점수를 줘요. 맞는 줄이 없으면 0점이에요.
# 자료가 없는 항목은 0점으로 더하고, 리포트에 '자료 없는 배점'으로 따로 보여줘요.
[score]
top_n = 50                  # 첫 화면 점수 순위에 보여줄 종목 수 (나머지는 '전체 보기')
grade_a = 80                # 이 점수를 넘으면 A
grade_b = 70                # 넘으면 B
grade_c = 50                # 넘으면 C, 아니면 D
subsidiary_stake_min = 30.0 # 지분율(%)이 이 이상인 상장 회사를 '상장 자회사'로 봐요

[score.per]                 # 싼가: PER = 현재가 ÷ 최근 사업연도 EPS (미만). 적자면 0점
points = 10
steps = [[5, 10], [8, 7], [10, 5], [15, 2]]

[score.pbr]                 # 싼가: PBR (미만)
points = 3
steps = [[0.3, 3], [0.6, 2], [1.0, 1]]

[score.ratio]               # 싼가: 계산기 주가÷적정가 (이하)
points = 12
steps = [[0.75, 12], [0.9, 8], [1.0, 5], [1.2, 2]]

[score.roe]                 # 꾸준히 버나: ROE 5년 평균 % (이상)
points = 10
steps = [[15, 10], [10, 7], [8, 5], [5, 2]]

[score.no_loss]             # 꾸준히 버나: 최근 5년 EPS가 모두 0보다 크면 배점 전부
points = 5

[score.ttm]                 # 꾸준히 버나: 최근 4분기 EPS ÷ 최근 사업연도 EPS (이상)
points = 5
steps = [[0.9, 5], [0.7, 3]]

[score.payout]              # 배당 지속성: 계산기 배당성향 평균이 [criteria] 범위 안이면 배점 전부 (관문 ② 88행)
points = 5

[score.coverage]            # 배당 지속성: 잉여현금흐름 ÷ 배당이 기준 이상이면 배점 전부 (89행). 금융회사는 자본비율 판정
points = 5

[score.yield]               # 주주환원: 정상 DPS(계산기 B100) ÷ 현재가 % (초과). 특별배당 한 해에 부풀지 않게
points = 10
steps = [[7, 10], [5, 7], [3, 5], [0, 2]]

[score.streak]              # 주주환원: 배당 연속 인상 연수 (이상). 동결은 끊기지 않지만 세지 않아요
points = 5
steps = [[7, 5], [5, 4], [3, 3]]

[score.freq]                # 주주환원: 한 해 배당 횟수 (이상). 분기 4, 반기 2
points = 5
steps = [[4, 5], [2, 3]]

[score.buyback]             # 주주환원: 최근 3년 매년 자사주를 사거나 소각했으면 배점 전부
points = 7

[score.cancel]              # 주주환원: 최근 사업연도 소각 주식 ÷ 발행주식 % (초과)
points = 8
steps = [[2, 8], [1.5, 5], [0.5, 3]]

[score.treasury]            # 주주환원: 자사주 보유 비율 % (미만). 0주면 none_points
points = 5
steps = [[2, 4], [5, 2]]
none_points = 5

[score.subsidiary]          # 기타: 지분 subsidiary_stake_min% 이상 상장 자회사가 없으면 배점 전부
points = 5

# ---- 백테스트 (uv run backtest.py) ----
# 과거 실제 자료로 계산기를 검증해요. 판정 기준은 위 [criteria] 그대로이고, 여기는 투자 규칙과 비교 대상이에요.
[backtest]
start = 2018-04-01            # 시작일 (DART 재무 자료가 2015 사업연도부터라 이때부터 5년 치가 모여요)
end = 2026-11-20              # 끝 날
second_start = 2020-11-02     # 두 번째 실행 시작일 (환노출 S&P500 ETF가 생긴 뒤 같은 기간끼리 비교)
monthly = 1300000             # 매달 첫 거래일에 넣는 돈 (원)
max_holdings = 5              # 최대 보유 종목 수
cost_rate = 0.0025            # 살 때·팔 때 각각 빼는 비용 비율 (수수료·거래세·체결 차이)
min_trade = 10000             # 한 종목에 이보다 적은 돈이면 사지 않고 CMA에 둬요 (원)
cma = [["214980", 2018-01-01], ["357870", 2020-07-07]]   # 남는 돈(CMA) 이자로 쓰는 ETF, 그날부터

[backtest.benchmarks]         # 같은 날 같은 돈을 넣어 계속 들고 있는 비교 대상 ("etf:코드" 또는 "index:지수 이름")
"나스닥100 (TIGER 미국나스닥100)" = "etf:133690"
"S&P500 환헤지 (TIGER 미국S&P500선물(H))" = "etf:143850"
"코스피" = "index:코스피"
"고배당 ETF (PLUS 고배당주)" = "etf:161510"

[backtest.second_benchmarks]  # 두 번째 실행(second_start부터)에만 더하는 비교 대상
"S&P500 환노출 (TIGER 미국S&P500)" = "etf:360750"

[backtest.variants]           # 나란히 돌려 볼 기준값 바꾸기 ({}는 [criteria] 그대로)
"지금 규칙" = {}
"배당성향 하한 없음" = { payout_min = 0.0 }
